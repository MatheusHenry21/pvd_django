    <!DOCTYPE html>
    <html lang="pt-BR">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>{% block title %}PVDPro{% endblock %}</title>
    </head>
    <body>

        <div class="layout">

            <aside class="sidebar">

                <header class="sidebar-header">
                    <h1>PVDPro</h1>
                </header>

                <nav>

                    <a href="">
                        Dashboard
                    </a>

                    <a href="">
                        Vendas
                    </a>

                    <a href="">
                        Produtos
                    </a>

                    <a href="">
                        Clientes
                    </a>

                    <a href="">
                        Caixa
                    </a>

                    <a href="">
                        Crediário
                    </a>

                    <a href="">
                        Relatórios
                    </a>

                </nav>

                <footer>
                    <a href="">
                        Sair
                    </a>
                </footer>
            </aside>

            <main class="main">

                <header class="main-header">
                    {% block page_title %} 
                    {% endblock %}
                </header>

                <section class="content">
                    {% block content %}
                    {% endblock %}
                </section> 

                <footer class="main-footer">
                    <p>
                        PVDPro
                    </p>
                </footer>
            </main>
        </div>
    </body>
</html>
